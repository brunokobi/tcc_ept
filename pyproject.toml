[project]
name = "tcc-aderencia"
version = "0.1.0"
description = "Aderência territorial e desempenho da EaD na Rede Federal de EPT (TCC IFSul)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "py7zr>=0.20",
  "statsmodels>=0.14",
  "linearmodels>=6.0",
  "scikit-learn>=1.4",
  "sentence-transformers>=3.0",
  "krippendorff>=0.6",
  "shap>=0.45",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
dashboard = ["streamlit>=1.38", "plotly>=5.22", "geopandas>=1.0"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "jupyterlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc_aderencia"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
